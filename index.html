<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div>
            <h1>🎓 Student Task Manager</h1>
            <p>Organize your studies and stay productive.</p>
        </div>

    </header>


    <!-- Main Application -->
    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2>Menu</h2>

            <nav>
                <a href="#" class="active">Dashboard</a>
                <a href="#">My Tasks</a>
                <a href="#">Projects</a>
                <a href="#">Settings</a>
            </nav>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <h2>Dashboard</h2>

            <p class="welcome">
                Welcome! Manage your study tasks from here.
            </p>


            <!-- Statistics -->
            <section class="statistics">

                <div class="stat-card">
                    <h3>Total Tasks</h3>
                    <p id="totalTasks">0</p>
                </div>

                <div class="stat-card">
                    <h3>Completed</h3>
                    <p id="completedTasks">0</p>
                </div>

                <div class="stat-card">
                    <h3>Pending</h3>
                    <p id="pendingTasks">0</p>
                </div>

            </section>


            <!-- Tasks -->
            <section class="tasks-section">

                <div class="section-header">
                    <h2>My Tasks</h2>

                    <button id="addTaskButton">
                        + Add Task
                    </button>
                </div>

                <div id="todoContainer" class="todo-container">

                    <div class="empty-state">

                        <h3>No tasks yet</h3>

                        <p>
                            Start by adding your first task.
                        </p>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
