<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div>
            <h1>🎓 Student Task Manager</h1>
            <p>Organize your studies and stay productive.</p>
        </div>

    </header>


    <!-- Main Application -->
    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2>Menu</h2>

            <nav>
                <a href="#" class="active">Dashboard</a>
                <a href="#">My Tasks</a>
                <a href="#">Projects</a>
                <a href="#">Settings</a>
            </nav>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <h2>Dashboard</h2>

            <p class="welcome">
                Welcome! Manage your study tasks from here.
            </p>


            <!-- Statistics -->
            <section class="statistics">

                <div class="stat-card">
                    <h3>Total Tasks</h3>
                    <p id="totalTasks">0</p>
                </div>

                <div class="stat-card">
                    <h3>Completed</h3>
                    <p id="completedTasks">0</p>
                </div>

                <div class="stat-card">
                    <h3>Pending</h3>
                    <p id="pendingTasks">0</p>
                </div>

            </section>


            <!-- Tasks -->
            <section class="tasks-section">

                <div class="section-header">
                    <h2>My Tasks</h2>

                    <button id="addTaskButton">
                        + Add Task
                    </button>
                </div>
                <div id="taskForm" class="task-form">

    <h2>Add New Task</h2>

    <input
        type="text"
        id="taskTitle"
        placeholder="Enter task title"
    >

    <textarea
        id="taskDescription"
        placeholder="Enter task description"
    ></textarea>

    <select id="taskPriority">

        <option value="Low">Low Priority</option>
        <option value="Medium">Medium Priority</option>
        <option value="High">High Priority</option>

    </select>

    <input
        type="date"
        id="taskDueDate"
    >
    <select id="taskProject">

    <option value="">No Project</option>

</select>
    >

    <button id="saveTaskButton">
        Add Task
    </button>

</div>
<!-- Search and Filter -->
<div class="task-controls">

    <input
        type="text"
        id="searchInput"
        placeholder="Search tasks..."
    >

    <select id="filterSelect">
        <option value="all">All Tasks</option>
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
    </select>

</div>

                <div id="todoContainer" class="todo-container">
                </div>

            </section>
             <!-- Projects Section -->
<section class="projects-section">

    <div class="section-header">

        <h2>My Projects</h2>

        <button id="addProjectButton">
            + Add Project
        </button>

    </div>


    <!-- Project Form -->
    <div id="projectForm" class="project-form">

        <h3>Add New Project</h3>

        <input
            type="text"
            id="projectName"
            placeholder="Enter project name"
        >

        <textarea
            id="projectDescription"
            placeholder="Enter project description"
        ></textarea>

        <button id="saveProjectButton">
            Add Project
        </button>

    </div>


    <!-- Projects will appear here -->
    <div id="projectContainer" class="project-container">

    </div>

    </section>
        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
